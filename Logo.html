<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SentryLink - Secure Scanning</title>

  <style>
    :root {
      --bg-1: #2f1468;
      --bg-2: #431f8b;
      --bg-3: #5d33b4;
      --white-soft: rgba(255, 255, 255, 0.12);
      --white-line: rgba(255, 255, 255, 0.95);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: clamp(0px, 1.2vmin, 16px);
      overflow: hidden;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.08), transparent 28%),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,0.05), transparent 24%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2) 55%, var(--bg-3));
    }

    .stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
    }

    .ambient-glow {
      position: absolute;
      width: min(520px, 96vw);
      aspect-ratio: 1 / 1;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.07) 35%, rgba(255,255,255,0) 70%);
      transform: scale(1);
      opacity: 0.85;
      pointer-events: none;
      z-index: 0;
      animation: glowFloat 7s ease-in-out infinite;
      will-change: transform, opacity;
    }

    @keyframes glowFloat {
      0%, 100% {
        transform: scale(0.98) translate3d(0, 0, 0);
        opacity: 0.78;
      }
      50% {
        transform: scale(1.04) translate3d(0, -4px, 0);
        opacity: 1;
      }
    }

    .logo-wrap {
      position: relative;
      width: min(420px, 88vw);
      z-index: 1;
      contain: layout paint style;
      transform: translateY(-1.5%);
      transform-origin: center;
    }

    .logo-img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      filter: drop-shadow(0 14px 34px rgba(0, 0, 0, 0.24));
    }

    .scan-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      border-radius: 2px;
    }

    .scan-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    @media (max-width: 140px), (max-height: 140px) {
      .logo-wrap {
        transform: translateY(-5%);
      }
    }
  </style>
</head>

      <div class="scan-overlay">
        <canvas class="scan-canvas" id="scanCanvas"></canvas>
      </div>

  </main>

  <script>
    (() => {
      const logoWrap = document.getElementById('logoWrap');
      const canvas = document.getElementById('scanCanvas');
      const ctx = canvas.getContext('2d', { alpha: true });

      const DPR_LIMIT = 1.5;
      const LINE_HEIGHT = 1.7;
      const SCAN_SPEED = 0.36;          // fraction of image height per second
      const PARTICLE_SPAWN_RATE = 30;   // particles per second
      const MAX_PARTICLES = 120;
      const TRAIL_DEPTH = 28;
      const HAZE_HEIGHT = 14;

      let width = 1;
      let height = 1;
      let dpr = 1;

      let progress = 0;
      let direction = 1;
      let lastTime = performance.now();
      let spawnAccumulator = 0;

      const particles = [];

      function resizeCanvas() {
        const rect = logoWrap.getBoundingClientRect();
        width = Math.max(1, Math.round(rect.width));
        height = Math.max(1, Math.round(rect.height));
        dpr = Math.min(window.devicePixelRatio || 1, DPR_LIMIT);

        canvas.width = Math.max(1, Math.round(width * dpr));
        canvas.height = Math.max(1, Math.round(height * dpr));
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function spawnParticle(lineY, dir) {
        if (particles.length >= MAX_PARTICLES) return;

        const sizeScale = clamp(width / 140, 0.28, 1.35);
        const size = (0.75 + Math.random() * 1.35) * sizeScale;
        const x = Math.random() * width;

        const trailOffset = dir === 1
          ? -(Math.random() * TRAIL_DEPTH)
          : (Math.random() * TRAIL_DEPTH);

        const scatter = (Math.random() - 0.5) * 8;
        const y = clamp(lineY + trailOffset + scatter, 0, height);

        particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 10,
          vy: dir === 1
            ? (-6 - Math.random() * 12)
            : (6 + Math.random() * 12),
          size,
          life: 0.65 + Math.random() * 0.35,
          maxLife: 0.65 + Math.random() * 0.35,
          alpha: 0.35 + Math.random() * 0.55
        });
      }

      function updateParticles(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life -= dt;

          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }

          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vx *= 0.992;

          if (p.x < -10 || p.x > width + 10 || p.y < -20 || p.y > height + 20) {
            particles.splice(i, 1);
          }
        }
      }

      function drawParticles() {
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          const t = p.life / p.maxLife;
          const alpha = p.alpha * t;

          ctx.beginPath();
          ctx.fillStyle = `rgba(255,255,255,${alpha})`;
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();

          // soft outer glow without heavy DOM blur
          ctx.beginPath();
          ctx.fillStyle = `rgba(255,255,255,${alpha * 0.12})`;
          ctx.arc(p.x, p.y, p.size * 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawHaze(y) {
        const hazeY = y - HAZE_HEIGHT * 0.45;
        const grad = ctx.createLinearGradient(0, hazeY, 0, hazeY + HAZE_HEIGHT);

        grad.addColorStop(0, 'rgba(255,255,255,0.20)');
        grad.addColorStop(0.45, 'rgba(255,255,255,0.09)');
        grad.addColorStop(1, 'rgba(255,255,255,0.00)');

        ctx.fillStyle = grad;
        ctx.fillRect(0, hazeY, width, HAZE_HEIGHT);
      }

      function drawScanLine(y) {
        // broad glow
        ctx.fillStyle = 'rgba(255,255,255,0.10)';
        ctx.fillRect(0, y - 4, width, 8);

        // mid glow
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        ctx.fillRect(0, y - 2, width, 4);

        // crisp center line
        const lineGrad = ctx.createLinearGradient(0, 0, width, 0);
        lineGrad.addColorStop(0, 'rgba(255,255,255,0.00)');
        lineGrad.addColorStop(0.10, 'rgba(255,255,255,0.35)');
        lineGrad.addColorStop(0.25, 'rgba(255,255,255,0.90)');
        lineGrad.addColorStop(0.50, 'rgba(255,255,255,1.00)');
        lineGrad.addColorStop(0.75, 'rgba(255,255,255,0.90)');
        lineGrad.addColorStop(0.90, 'rgba(255,255,255,0.35)');
        lineGrad.addColorStop(1, 'rgba(255,255,255,0.00)');

        ctx.fillStyle = lineGrad;
        ctx.fillRect(0, y - LINE_HEIGHT / 2, width, LINE_HEIGHT);
      }

      function drawFrame(now) {
        const dtRaw = (now - lastTime) / 1000;
        const dt = Math.min(dtRaw, 0.033); // clamp to avoid big jumps
        lastTime = now;

        if (document.hidden) {
          requestAnimationFrame(drawFrame);
          return;
        }

        progress += direction * SCAN_SPEED * dt;

        if (progress >= 1) {
          progress = 1;
          direction = -1;
        } else if (progress <= 0) {
          progress = 0;
          direction = 1;
        }

        const lineY = progress * Math.max(0, height - LINE_HEIGHT);

        const spawnRateScale = clamp(width / 220, 0.35, 1);
        spawnAccumulator += dt * PARTICLE_SPAWN_RATE * spawnRateScale;
        while (spawnAccumulator >= 1) {
          spawnAccumulator -= 1;
          spawnParticle(lineY, direction);
        }

        updateParticles(dt);

        ctx.clearRect(0, 0, width, height);
        drawParticles();
        drawHaze(lineY);
        drawScanLine(lineY);

        requestAnimationFrame(drawFrame);
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      const resizeObserver = new ResizeObserver(() => {
        resizeCanvas();
      });

      resizeObserver.observe(logoWrap);
      window.addEventListener('resize', resizeCanvas, { passive: true });

      document.addEventListener('visibilitychange', () => {
        lastTime = performance.now();
      });

      resizeCanvas();
      requestAnimationFrame(drawFrame);
    })();
  </script>
</body>
</html>
