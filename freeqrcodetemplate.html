<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free QR Code Generator</title>
    <!-- Importing the free qrcode.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            border: 2px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        #qrcode {
            display: flex;
            justify-content: center;
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>QR Code Generator</h2>
    <p>Type below to generate a QR code instantly.</p>
    <input type="text" id="text-input" placeholder="Enter URL or text" oninput="generateQR()">
    <div id="qrcode"></div>
</div>

<script>
    // Create the QR container with initial settings
    const qrcode = new QRCode(document.getElementById("qrcode"), {
        width: 200,
        height: 200,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
    });

    function generateQR() {
        const text = document.getElementById("text-input").value;
        if (text.trim() === "") {
            qrcode.clear(); 
        } else {
            qrcode.makeCode(text);
        }
    }

    // Default code on page load
    qrcode.makeCode("https://google.com");
</script>

</body>
</html>
